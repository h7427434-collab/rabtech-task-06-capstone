<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RabTech Full Stack Capstone Project">
  <title>Capstone Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>Capstone Store</h1>

    <nav aria-label="Main navigation">
      <a href="#products">Products</a>
      <a href="#dashboard">Dashboard</a>
      <button id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <main>

    <section id="loginSection" class="auth-section">
      <h2>Welcome Back</h2>
      <p>Sign in to access your product dashboard.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">Sign In</button>
      </form>

      <p id="loginMessage" class="message"></p>
    </section>

    <section id="dashboard" class="dashboard hidden">
      <h2>Product Dashboard</h2>

      <div class="stats">
        <article>
          <h3>Total Products</h3>
          <p id="productCount">0</p>
        </article>

        <article>
          <h3>Storage</h3>
          <p>Persistent</p>
        </article>
      </div>

      <form id="productForm" class="product-form">
        <h3>Add Product</h3>

        <label for="productName">Product Name</label>
        <input type="text" id="productName" required>

        <label for="productPrice">Price</label>
        <input type="number" id="productPrice" min="0" step="0.01" required>

        <label for="productCategory">Category</label>
        <select id="productCategory" required>
          <option value="">Select category</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Books">Books</option>
          <option value="Accessories">Accessories</option>
        </select>

        <button type="submit">Add Product</button>
      </form>

      <section id="products">
        <h2>Product Catalog</h2>

        <input
          type="search"
          id="searchInput"
          placeholder="Search products..."
          aria-label="Search products"
        >

        <div id="productList" class="product-list"></div>
      </section>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 RabTech Capstone Project</p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
